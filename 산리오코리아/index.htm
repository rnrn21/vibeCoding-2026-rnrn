<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>산리오코리아</title>
    <style>
        /* --- 공통 스타일 및 리셋 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            color: #333;
        }

        /* --- 1. 상단영역 (Header) --- */
        .site-header {
            width: 100%;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }

        .header-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100px;
            padding: 0 20px;
        }

        .logo-box {
            flex-shrink: 0;
        }
        .logo-img {
            height: 56px;
        }

        .nav-list {
            display: flex;
            gap: 40px;
            list-style: none;
            font-size: 1.1rem;
        }

        .nav-list a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        .nav-list a:hover {
            color: #ff69b4;
        }

        /* --- 2. 메인영역 --- */
        /* 2-1. 배너 영역 */
        .main-banner {
            background-image: url('./images/images/스크린샷 2026-10-08 12.10.46.png');
            background-repeat: repeat;
            padding: 80px 0; /* 배너 전체 위아래 패딩 부여 */
        }

        .main-visual-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 900px;
            height: 500px;
            margin: 0 auto;
            background: transparent;
        }

        .main-visual-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 미디어 쿼리 (반응형) */
        @media (max-width: 1000px) {
            .main-visual-box {
                width: 100vw;
                max-width: 100%;
                height: auto;
                padding: 0 16px;
            }
            .main-visual-img {
                width: 100%;
                height: auto;
            }
        }

        /* 각 섹션 기본 공백 (추후 내용 추가 시 활용) */
        .character-section,
        .company-section,
        .recruit-section,
        .place-section,
        .contact-section {
            padding: 60px 20px;
        }
    </style>
</head>
<body>

    <main class="wrapper">
        
        <!-- 1. 상단영역 -->
        <header class="site-header">
            <div class="header-inner">
                <!-- 로고 이미지 박스 -->
                <figure class="logo-box">
                    <a href="#">
                        <img src="./images/images/logo_2023.png" alt="산리오코리아 로고" class="logo-img">
                    </a>
                </figure>
                <!-- 메뉴 리스트 -->
                <nav class="header-nav">
                    <ul class="nav-list">
                        <li><a href="#company">company</a></li>
                        <li><a href="#character">character</a></li>
                        <li><a href="#place">place</a></li>
                        <li><a href="#recruit">recruit</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- 2. 메인영역 -->
        <div class="site-main">
            
            <!-- 2-1. 배너영역 -->
            <section class="main-banner">
                <figure class="main-visual-box">
                    <img src="./images/images/main_visual_pc_v1.png" alt="메인 비주얼" class="main-visual-img">
                </figure>
                <div class="sns-buttons">
                    <a href="https://www.instagram.com" target="_blank" rel="noopener" style="display: block;">
                        <img src="./images/images/i_ins_pc_v3.png" alt="인스타그램" style="width: 44px; height: 44px; display: block;">
                    </a>
                    <a href="https://www.youtube.com" target="_blank" rel="noopener" style="display: block;">
                        <img src="./images/images/i_you_pc_v3.png" alt="유튜브" style="width: 44px; height: 44px; display: block;">
                    </a>
                </div>
                <style>
                    /* 분홍색 타일 박스 부모 영역에 기준점(relative) 부여 */
                    .main-banner, .main-visual-box {
                        position: relative !important;
                    }
                    
                    /* SNS 버튼 박스 스타일 및 위치 설정 */
                    .sns-buttons {
                        position: absolute;
                        top: 30px;
                        right: 30px;
                        display: flex;
                        flex-direction: column;
                        gap: 12px;
                        z-index: 2;
                    }
            
                    @media (max-width: 900px) {
                        .sns-buttons {
                            top: 20px;
                            right: 10px;
                        }
                    }
                </style>
            
            <!-- 2-2. 캐릭터영역 -->
            <section class="character-section">
                <!-- 캐릭터 영역 내용은 추후 추가 -->
            </section>

            <!-- 2-3. 컴퍼니영역 -->
            <section class="company-section">
                <!-- 컴퍼니 영역 내용은 추후 추가 -->
            </section>

            <!-- 2-4. 리쿠르트영역 -->
            <section class="recruit-section">
                <!-- 리쿠르트 영역 내용은 추후 추가 -->
            </section>

            <!-- 2-5. 플레이스영역 -->
            <section class="place-section">
                <!-- 플레이스 영역 내용은 추후 추가 -->
            </section>

            <!-- 2-6. 컨텍어스영역 -->
            <section class="contact-section">
                <!-- 컨텍어스 영역 내용은 추후 추가 -->
            </section>

        </div>

        <!-- 3. 하단영역 -->
        <footer class="site-footer">
            <!-- 하단 영역 내용은 추후 추가 -->
        </footer>

    </main>

</body>
</html>
